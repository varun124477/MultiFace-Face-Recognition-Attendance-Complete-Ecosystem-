<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AttendAI — Attendance Reports</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0b0f;--surface:#12141a;--card:#1a1d26;--border:#252836;--accent:#00e5a0;--accent2:#5b6ef5;--warn:#f5a623;--danger:#f54b4b;--text:#e8eaf0;--muted:#6b7280;--mono:'Space Mono',monospace;--sans:'DM Sans',sans-serif;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--sans);}
  .layout{display:flex;height:100vh;overflow:hidden;}

  .sidebar{width:220px;height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;}
  .logo{padding:24px 24px 20px;border-bottom:1px solid var(--border);}
  .logo-mark{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--accent);letter-spacing:-1px;}
  .logo-sub{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:2px;}
  .nav-section{padding:16px 24px 6px;font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;}
  .nav-item{display:flex;align-items:center;gap:12px;padding:11px 24px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:500;transition:all .2s;border-left:3px solid transparent;text-decoration:none;}
  .nav-item:hover,.nav-item.active{color:var(--text);background:rgba(0,229,160,.06);border-left-color:var(--accent);}
  .nav-item .icon{font-size:15px;width:20px;text-align:center;}
  .sidebar-footer{margin-top:auto;padding:16px 24px;border-top:1px solid var(--border);}

  .main{flex:1;height:100vh;overflow-y:auto;padding:24px 28px;display:flex;flex-direction:column;gap:20px;}
  .main::-webkit-scrollbar{width:6px;}.main::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

  .header{display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
  .header h1{font-size:21px;font-weight:600;letter-spacing:-.5px;}

  /* Student cards grid */
  .students-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}

  .student-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
  .student-card:hover{border-color:var(--accent);transform:translateY(-2px);}
  .student-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent);}
  .student-card.warn::before{background:var(--warn);}
  .student-card.danger::before{background:var(--danger);}

  .sc-name{font-size:14px;font-weight:600;margin-bottom:2px;}
  .sc-roll{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:12px;}
  .sc-bar-track{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:6px;}
  .sc-bar-fill{height:100%;border-radius:3px;}
  .sc-stats{display:flex;justify-content:space-between;align-items:center;}
  .sc-pct{font-family:var(--mono);font-size:18px;font-weight:700;}
  .sc-detail{font-size:11px;color:var(--muted);}

  /* Modal */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:999;}
  .modal-bg.open{display:flex;}
  .modal{background:var(--card);border:1px solid var(--border);border-radius:16px;width:680px;max-height:80vh;overflow:hidden;display:flex;flex-direction:column;animation:fadeUp .3s ease;}
  .modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);}
  .modal-title{font-size:16px;font-weight:600;}
  .modal-close{cursor:pointer;color:var(--muted);font-size:20px;line-height:1;}
  .modal-body{overflow-y:auto;padding:0;}
  .modal-body::-webkit-scrollbar{width:4px;}.modal-body::-webkit-scrollbar-thumb{background:var(--border);}

  /* Modal stats */
  .modal-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-bottom:1px solid var(--border);}
  .ms-item{padding:16px 20px;border-right:1px solid var(--border);}
  .ms-item:last-child{border-right:none;}
  .ms-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-family:var(--mono);}
  .ms-value{font-family:var(--mono);font-size:24px;font-weight:700;margin-top:4px;}

  table{width:100%;border-collapse:collapse;font-size:12px;}
  thead th{padding:9px 16px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);border-bottom:1px solid var(--border);font-family:var(--mono);position:sticky;top:0;background:var(--card);}
  tbody tr{border-bottom:1px solid rgba(37,40,54,.5);}
  tbody tr:hover{background:rgba(255,255,255,.02);}
  td{padding:10px 16px;}
  td.mono{font-family:var(--mono);font-size:11px;color:var(--muted);}

  .badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-family:var(--mono);font-weight:700;}
  .badge.present{background:rgba(0,229,160,.15);color:var(--accent);}
  .badge.absent{background:rgba(245,75,75,.15);color:var(--danger);}

  .export-btn{display:flex;align-items:center;gap:8px;background:rgba(91,110,245,.15);border:1px solid rgba(91,110,245,.35);color:var(--accent2);padding:6px 14px;border-radius:8px;font-family:var(--mono);font-size:11px;font-weight:700;cursor:pointer;text-decoration:none;}
  .export-btn:hover{background:rgba(91,110,245,.25);}

  .empty{padding:28px;text-align:center;color:var(--muted);font-size:12px;}
  .loading{padding:28px;text-align:center;color:var(--muted);font-size:12px;font-family:var(--mono);}

  .search-bar{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 14px;color:var(--text);font-family:var(--sans);font-size:13px;outline:none;width:260px;}
  .search-bar:focus{border-color:var(--accent);}

  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="layout">

<nav class="sidebar">
  <div class="logo">
    <div class="logo-mark">AttendAI</div>
    <div class="logo-sub">Reports</div>
  </div>
  <div class="nav-section">Navigation</div>
  <a class="nav-item" href="/dashboard"><span class="icon">⬡</span> Dashboard</a>
  <a class="nav-item active" href="/report"><span class="icon">📋</span> Reports</a>
  <a class="nav-item" href="/admin"><span class="icon">🛡</span> Admin</a>
  <a class="nav-item" href="/api/export_csv" download><span class="icon">⬇</span> Export CSV</a>
  <a class="nav-item" href="/login"><span class="icon">→</span> Logout</a>
</nav>

<main class="main">
  <div class="header">
    <div>
      <h1>Student Reports</h1>
      <p style="font-size:12px;color:var(--muted);margin-top:2px;font-family:var(--mono)">Click a student to view full history</p>
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <input class="search-bar" type="text" placeholder="Search student..." oninput="filterStudents(this.value)">
      <a class="export-btn" href="/api/export_csv" download>⬇ Export All</a>
    </div>
  </div>

  <div class="students-grid" id="students-grid">
    <div class="loading">Loading students...</div>
  </div>
</main>
</div>

<!-- Modal -->
<div class="modal-bg" id="modal-bg" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="modal-name">—</div>
        <div style="font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:2px" id="modal-roll">—</div>
      </div>
      <span class="modal-close" onclick="closeModal()">✕</span>
    </div>
    <div class="modal-body">
      <div class="modal-stats">
        <div class="ms-item">
          <div class="ms-label">Attended</div>
          <div class="ms-value" id="modal-attended" style="color:var(--accent)">—</div>
        </div>
        <div class="ms-item">
          <div class="ms-label">Total Classes</div>
          <div class="ms-value" id="modal-total">—</div>
        </div>
        <div class="ms-item">
          <div class="ms-label">Percentage</div>
          <div class="ms-value" id="modal-pct">—</div>
        </div>
      </div>
      <table>
        <thead><tr><th>#</th><th>Date</th><th>Subject</th><th>Windows Seen</th><th>Status</th><th>Time</th></tr></thead>
        <tbody id="modal-body"><tr><td colspan="6"><div class="loading">Loading...</div></td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script>
let allStudents = [];
let attendanceData = {};

function cap(s){return(s||'').replace(/\b\w/g,c=>c.toUpperCase());}

async function init() {
  // Load students + attendance in parallel
  const [sRes, aRes] = await Promise.all([
    fetch('/api/students'),
    fetch('/api/attendance')
  ]);
  allStudents = await sRes.json();
  const records = await aRes.json();

  // Group attendance by student
  attendanceData = {};
  for (const r of records) {
    if (!attendanceData[r.student_id]) attendanceData[r.student_id] = [];
    attendanceData[r.student_id].push(r);
  }

  renderStudents(allStudents);
}

function renderStudents(students) {
  const grid = document.getElementById('students-grid');
  if (!students.length) {
    grid.innerHTML = '<div class="empty">No students found.</div>'; return;
  }

  grid.innerHTML = students.map(s => {
    const records = attendanceData[s.student_id] || [];
    const present = records.filter(r => r.status === 'present').length;
    const total   = parseInt(s.total_classes) || 30;
    const pct     = total ? Math.round((present/total)*100) : 0;
    const cls     = pct < 60 ? 'danger' : pct < 75 ? 'warn' : '';
    const col     = pct < 60 ? 'var(--danger)' : pct < 75 ? 'var(--warn)' : 'var(--accent)';

    return `<div class="student-card ${cls}" onclick="openModal('${s.student_id}')">
      <div class="sc-name">${cap(s.name||'')}</div>
      <div class="sc-roll">${s.roll||'—'} · ${s.student_id||''}</div>
      <div class="sc-bar-track">
        <div class="sc-bar-fill" style="width:${pct}%;background:${col}"></div>
      </div>
      <div class="sc-stats">
        <div class="sc-pct" style="color:${col}">${pct}%</div>
        <div class="sc-detail">${present} / ${total} classes</div>
      </div>
    </div>`;
  }).join('');
}

function filterStudents(q) {
  const filtered = allStudents.filter(s =>
    (s.name||'').toLowerCase().includes(q.toLowerCase()) ||
    (s.roll||'').includes(q)
  );
  renderStudents(filtered);
}

async function openModal(student_id) {
  const student = allStudents.find(s => s.student_id === student_id);
  if (!student) return;

  document.getElementById('modal-name').textContent = cap(student.name||'');
  document.getElementById('modal-roll').textContent  = student.roll + ' · ' + student_id;

  const records = (attendanceData[student_id] || [])
    .sort((a,b) => (b.date||'').localeCompare(a.date||''));

  const present  = records.filter(r=>r.status==='present').length;
  const total    = parseInt(student.total_classes)||30;
  const pct      = total ? Math.round((present/total)*100) : 0;
  const pctCol   = pct<60?'var(--danger)':pct<75?'var(--warn)':'var(--accent)';

  document.getElementById('modal-attended').textContent = present;
  document.getElementById('modal-total').textContent    = total;
  document.getElementById('modal-pct').textContent      = pct + '%';
  document.getElementById('modal-pct').style.color      = pctCol;

  const tbody = document.getElementById('modal-body');
  if (!records.length) {
    tbody.innerHTML = '<tr><td colspan="6"><div class="empty">No attendance records.</div></td></tr>';
  } else {
    tbody.innerHTML = records.map((r,i) => {
      const ts  = (r.timestamp||'').split(' ')[1]||'—';
      const win = r.windows_seen!==undefined ? r.windows_seen+'/3' : '—';
      return `<tr>
        <td class="mono">${i+1}</td>
        <td class="mono">${r.date||'—'}</td>
        <td style="font-size:12px">${r.subject||'—'}</td>
        <td class="mono">${win}</td>
        <td><span class="badge ${r.status||'present'}">${r.status||'present'}</span></td>
        <td class="mono" style="color:var(--accent)">${ts}</td>
      </tr>`;
    }).join('');
  }

  document.getElementById('modal-bg').classList.add('open');
}

function closeModal(e) {
  if (!e || e.target === document.getElementById('modal-bg') || !e.target) {
    document.getElementById('modal-bg').classList.remove('open');
  }
}

init();
</script>
</body>
</html>
